name: Offline regression tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --check gmx_bridge.mjs
      - run: node -e "require('@gmx-io/sdk/v2')"
      - run: python -m unittest discover -s tests -v
      - run: docker build -t traider-gmx-ci .
      - run: docker run --rm --entrypoint node traider-gmx-ci -e "require('@gmx-io/sdk/v2')"
      - run: docker run --rm --entrypoint python traider-gmx-ci -c "import main, chart_image, gmx_client"
